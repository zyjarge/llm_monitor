# Prometheus configuration for llm_monitor stack.
#
# Topology:
#   scraper (5min) → pushgateway (:9091) ← prometheus (:9090) ← grafana (:3000)
#   Also scrape node_exporter for host-level metrics.
#
# All scrape targets are on the docker-compose default network and reached
# by their service name.

global:
  scrape_interval: 30s     # how often to scrape each target
  evaluation_interval: 30s
  external_labels:
    monitor: llm-monitor

scrape_configs:
  # ─── Pushgateway (where scraper pushes metrics) ─────────────────
  # honor_labels: true keeps the original 'job' label set by the scraper
  # (otherwise prometheus would overwrite it with its own job name).
  # In host network mode there's no docker DNS, so we use localhost.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ['localhost:9091']

  # ─── Prometheus itself (for prom self-monitoring) ───────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ─── Host metrics (CPU / mem / disk) ───────────────────────────
  - job_name: node
    static_configs:
      - targets: ['localhost:9100']
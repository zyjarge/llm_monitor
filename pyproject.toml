[project]
name = "llm-monitor"
version = "0.1.0"
description = "Unified quota monitoring for MiniMax CN, OpenCode Go, and Kimi Code"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.47",
    "pydantic-settings>=2.5",
    "prometheus-client>=0.21",
    "loguru>=0.7",
    "apscheduler>=3.10",
    "aiosqlite>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",          # mock httpx
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["scraper/tests"]

[tool.uv]
package = false
